[project]
name = "rag-capstone-ingestion"
version = "0.1.0"
description = "Minimal ingestion service for chunking, embedding, and indexing documents in Elasticsearch."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "elasticsearch==9.5.1",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-slugify>=9.0.0",
]

[project.scripts]
rag-ingest = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
