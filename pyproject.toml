[project]
name = "rag-capstone-ingestion"
version = "0.1.0"
description = "Minimal ingestion service for chunking, embedding, and indexing documents in Elasticsearch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.7",
    "elasticsearch==8.15.1",
    "langchain-openai==0.2.2",
    "langchain-text-splitters==0.3.8",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pypdf==5.0.1",
    "python-docx==1.1.2",
    "slugify>=0.0.1",
]

[project.scripts]
rag-ingest = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
